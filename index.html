<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Raghu">
    <title>Librex | Digital Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1 class="logo">Librex</h1>
        <p class="tagline">Explore the Digital Archive</p>
    </nav>

    <header class="control-panel">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for books, authors, or subjects...">
            <button id="search-btn" class="btn-primary">Search</button>
        </div>

        <div class="filters-container">
            <select id="filter-dropdown" class="dropdown">
                <option value="all">All Books</option>
                <option value="fulltext">Full Text Available</option>
            </select>

            <select id="sort-dropdown" class="dropdown">
                <option value="default">Sort By: Default</option>
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
            </select>
        </div>
    </header>


    <main class="display-arena">
        <div id="results-grid" class="grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
